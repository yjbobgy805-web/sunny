<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;background:#f5f7fa;color:#222;overflow:hidden}
header{background:#1f4e78;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;height:58px}h1{font-size:20px;margin:0}
button{cursor:pointer}.topbtn,.toolbar button{border:1px solid #cbd3dc;background:#fff;border-radius:7px;padding:8px 11px}

.panel{background:#fff;border:1px solid #d9dee5;border-radius:10px;overflow:hidden;min-height:0;height:100%;display:flex;flex-direction:column}
.panel h2{font-size:15px;margin:0;padding:12px 14px;border-bottom:1px solid #e5e8ec;background:#fafbfc;flex-shrink:0}
.search{padding:10px;border-bottom:1px solid #e5e8ec;flex-shrink:0}.search input{width:100%;padding:10px;border:1px solid #cfd6df;border-radius:7px}
.scroll{overflow:auto;flex:1}.cat{padding:11px 14px;font-weight:700;border-bottom:1px solid #eee;cursor:pointer}.cat:hover,.cat.active{background:#eef5fb;color:#1f4e78}
.item{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid #eee}.item button{flex:1;text-align:left;border:1px solid #d5dce4;background:#fff;border-radius:7px;padding:9px}.item button:hover{background:#eef6ff}
.tag{font-size:11px;color:#777;min-width:70px;padding-top:10px}.toolbar{display:flex;gap:7px;padding:10px;border-bottom:1px solid #e5e8ec;flex-shrink:0}

.panel.result{display:flex;flex-direction:column}
.panel.result textarea{
  width:100%;
  min-width:0;
  flex:1;
  border:0;
  padding:15px;
  font-size:15px;
  line-height:1.7;
  resize:none;
  outline:0;
  white-space:pre-wrap;
  overflow-x:hidden;
  overflow-wrap:anywhere;

}

#admin{display:none;position:fixed;background:#fff;border:1px solid #aaa;border-radius:12px;z-index:99999;padding:18px;box-shadow:0 10px 40px #0002;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1100px,92vw);height:min(760px,88vh);min-width:620px;min-height:420px;max-width:96vw;max-height:94vh;resize:both}
#phraseTableWrap{height:calc(100% - 160px);overflow:auto;border:1px solid #d5dce4;border-radius:8px}
#phraseTable {

  table-layout: fixed;
  min-width: 800px;
  font-size: 13px;
}

#phraseTable th {
  position: sticky;
  top: 0;
  background: #f3f6f9;
  border-bottom: 1px solid #ccd5df;
  padding: 8px;
  text-align: left;
  z-index: 1;
}

#phraseTable td {
  border-bottom: 1px solid #e7ebef;
  padding: 6px;
  vertical-align: top;
}

#phraseTable th:nth-child(1), #phraseTable td:nth-child(1) { width: 100px; }
#phraseTable th:nth-child(2), #phraseTable td:nth-child(2) { width: 100px; }
#phraseTable th:nth-child(3), #phraseTable td:nth-child(3) { width: 140px; }
#phraseTable th:nth-child(4), #phraseTable td:nth-child(4) { width: auto; }

#phraseTable input,
#phraseTable select {
  width: 100%;
  border: 1px solid #ccd5df;
  border-radius: 5px;
  padding: 6px;
  font: inherit;
}

#phraseTable textarea {
  width: 100%;
  min-height: 75px;
  border: 1px solid #ccd5df;
  border-radius: 5px;
  padding: 6px;
  font: inherit;
  resize: vertical;
  white-space: pre;
  tab-size: 4;
}
.delbtn{border:1px solid #e0b6b6;background:#fff5f5;border-radius:5px;padding:6px;cursor:pointer}
.movebtn{border:1px solid #cbd3dc;background:#f8fafc;border-radius:4px;padding:4px 6px;font-size:11px;cursor:pointer}
.movebtn:hover{background:#e2e8f0}
.hint{font-size:12px;color:#666;margin:6px 0 10px}.saveok{color:#176b3a;font-size:12px;margin-left:8px}
.adminbar{display:flex;gap:8px;margin-bottom:8px}.adminbar input{padding:8px;border:1px solid #ccc;border-radius:6px}
.small{font-size:12px;color:#dcecff}

.admin-cat-filter {

#choiceModal {

/* 🖼️ 단순 이미지 뷰어 팝업 스타일 */

/* 복사 완료 토스트 팝업 스타일 */
#toast {
  visibility: hidden;
  min-width: 250px;
  margin-left: -125px;
  background-color: #333;
  color: #fff;
  text-align: center;
  border-radius: 8px;
  padding: 16px;

  z-index: 1000000;
  left: 50%;

}

#toast.show {
  visibility: visible;
  opacity: 1;
  bottom: 50px; /* 약간 위로 올라오면서 나타남 */
}


#imagePopup {width:620px;max-width:calc(100vw - 32px);max-height:94vh;overflow:auto;box-sizing:border-box;}
.drawing-toolbar,.drawing-colors {display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:10px;}

#drawingText {position:absolute;box-sizing:border-box;width:110px;max-width:95%;font:19px sans-serif;background:white;border:1px solid #0284c7;padding:3px;z-index:1;}

.drawing-toolbar #drawingCopy {background:#16806a;border-color:#16806a;color:#fff;font-weight:bold;}

.fibroid-controls {display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;margin:10px 0 4px;font-size:13px;}

.fibroid-hint {margin:4px 0 8px;font-size:11px;color:#526577;}
</style></head>
<body>

<div id="loginOverlay">
  <div class="login-box">
    <h2>🔒로그인</h2>
    <p style="font-size:13px; color:#666;">계정을 입력하세요</p>
    <input type="email" id="loginEmail" placeholder="아이디 입력">
    <input type="password" id="loginPassword" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') firebaseLogin()">
    <button onclick="firebaseLogin()">로그인</button>
    <div id="loginError">아이디나 비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAW6qlM__brCBG-9lKuVCwguUDnjbcTmX8",
      authDomain: "hospital-web-958bc.firebaseapp.com",
      projectId: "hospital-web-958bc",
      storageBucket: "hospital-web-958bc.firebasestorage.app",
      messagingSenderId: "453917371035",
      appId: "1:453917371035:web:3af6156729ca9cb324b43e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.db = db;
    window.doc = doc;
    window.getDoc = getDoc;
    window.setDoc = setDoc;

    window.firebaseLogin = function() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const errorMsg = document.getElementById('loginError');

        signInWithEmailAndPassword(auth, email, password)
            .then(async (userCredential) => {
                document.getElementById("loginOverlay").style.display = "none";
                if (typeof loadDataFromFirestore === "function") {
                    await loadDataFromFirestore();
                }
                initApp();
            })
            .catch((error) => {
                errorMsg.style.display = "block";
                document.getElementById('loginPassword').value = "";
                document.getElementById('loginPassword').focus();
            });
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            document.getElementById("loginOverlay").style.display = "none";
            if (typeof loadDataFromFirestore === "function") {
                await loadDataFromFirestore();
            }
            initApp();
        }
    });

    window.onload = function() {
        const emailInput = document.getElementById('loginEmail');
        if(emailInput) emailInput.focus();
    };
</script>

<header>
  <h1>결과 문구 작성기</h1>
  <div style="display:flex; gap:8px;">
    <button class="topbtn" onclick="openAdmin()">⚙ 문구 관리</button>

<div class="wrap" id="layoutWrap">
<section class="pane pane-cat" id="paneCat"><div class="panel"><h2>검사 항목</h2><div class="search"><input id="search" placeholder="문구 검색..." oninput="render()"></div><div id="categories" class="scroll"></div></div></section>
<div class="splitter" id="split1" title="드래그해서 폭 조절"></div>
<section class="pane pane-mid" id="paneMid"><div class="panel"><h2 id="middleTitle">문구 선택</h2><div id="items" class="scroll"></div></div></section>

<section class="pane pane-result" id="paneResult"><div class="panel result"><h2>결과지</h2><div class="toolbar"><button onclick="copyResult()">전체 복사</button><button onclick="clearResult()">전체 삭제</button><button onclick="addLine()">직접 입력</button></div><textarea id="result" placeholder="선택한 문구가 여기에 추가됩니다. (# : 1. 2. / @ : 1) 2) 로 자동 번호 변환)" oninput="reformatNumbers()"></textarea></div></section>
</div>

<div id="choiceModal">

<!-- 🖼️ 순수 이미지 보기 팝업 모달 -->

  <div class="drawing-toolbar">

<script>
const CATEGORY_ORDER = [
  "복부", "복부(신,췌,비)", "유방", "갑상선", "경동맥", "자궁", "전립선", "심장", "방광", "복부대동맥", "종검", "히스토리/의사"
];

function openImagePopup() {
    document.getElementById("imagePopup").style.display = "block";
}
function closeImagePopup() {
    document.getElementById("imagePopup").style.display = "none";
    document.getElementById("imagePopup").dispatchEvent(new Event("drawing-reset"));
}

async function loadDataFromFirestore() {
    try {
        if (window.db && window.doc && window.getDoc) {
            const docRef = window.doc(window.db, "settings", "phraseData");
            const docSnap = await window.getDoc(docRef);
            if (docSnap.exists() && docSnap.data().items) {
                data = docSnap.data().items;
            } else {
                data = DEFAULT_DATA;
                await saveTableToFirestore();
            }
        }
    } catch (e) {
        console.error("데이터 로드 실패:", e);
    }
}

async function saveTableToFirestore() {
    try {
        const docRef = window.doc(window.db, "settings", "phraseData");
        await window.setDoc(docRef, { items: data });
    } catch (e) {
        console.error("데이터 저장 실패:", e);
    }
}


// 토스트 팝업 띄우는 함수
function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.className = "show";
    
    // 2초(2000ms) 후에 팝업 숨기기
    setTimeout(function() {
        toast.className = toast.className.replace("show", "");
    }, 2000);
}

// 이미지 클릭 시 클립보드에 복사하는 함수
function copyImageToClipboard(imgElement) {
    const canvas = document.createElement("canvas");
    canvas.width = imgElement.naturalWidth || imgElement.width;
    canvas.height = imgElement.naturalHeight || imgElement.height;
    
    const ctx = canvas.getContext("2d");
    ctx.drawImage(imgElement, 0, 0);

    canvas.toBlob(async (blob) => {
        if (!blob) {
            showToast("이미지 변환에 실패했습니다.");
            return;
        }
        try {
            const item = new ClipboardItem({ "image/png": blob });
            await navigator.clipboard.write([item]);
            
            // 토스트 알림 띄우기
            showToast("이미지가 복사되었습니다!"); 
            
            // 🔥 복사 성공 후 팝업창을 자동으로 닫아줍니다.
            closeImagePopup(); 

        } catch (error) {
            console.error("클립보드 복사 실패:", error);
            showToast("복사 실패: 지원하지 않는 브라우저이거나 권한이 없습니다.");
        }
    }, "image/png");
}


function getOrderedCategories(dataList){
    const presentCats = [...new Set(dataList.map(x => x.category))];
    const ordered = CATEGORY_ORDER.filter(c => presentCats.includes(c));
    const remain = presentCats.filter(c => !CATEGORY_ORDER.includes(c));
    return [...ordered, ...remain];
}

function render(){
    let q=document.getElementById("search").value.trim().toLowerCase();
    let cats=getOrderedCategories(data);
    
    if(!cats.includes(currentCategory) && cats.length > 0){
        currentCategory = cats[0];
    }

    document.getElementById("categories").innerHTML=cats.map(c=>`
        <div class="cat ${c===currentCategory && !q ? 'active' : ''}" onclick="selectCat('${esc(c)}')">${esc(c)}</div>
    `).join("");

    let items=data.filter(x=>(!q?x.category===currentCategory:true)&&(!q||(x.label+x.text+x.group+x.category).toLowerCase().includes(q)));
    document.getElementById("middleTitle").textContent=q?"검색 결과":currentCategory+" 문구";
    document.getElementById("items").innerHTML=items.map(x=>`<div class="item"><span class="tag">${esc(x.group)}</span><button onclick="useItem(${data.indexOf(x)})">${esc(x.label)}</button></div>`).join("")||'<div style="padding:20px;color:#777">검색 결과가 없습니다.</div>';

function selectCat(c){
    currentCategory = c;
    document.getElementById("search").value = "";
    
    const targetCats = ["유방", "갑상선", "경동맥", "자궁", "전립선", "심장", "방광"];
    if (targetCats.includes(c)) {
        document.getElementById("result").value = "";
    }
    
    render();
}

function getTodayDate(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
}

function reformatNumbers(){
    let r = document.getElementById("result");
    let lines = r.value.split("\n");
    let mainIdx = 0;
    let subIdx = 0;

    const newLines = lines.map(line => {
        const mainMatch = line.match(/^(\s*)#\s*(.*)$/);
        const subMatch = line.match(/^(\s*)@\s*(.*)$/);
        const oldMain = line.match(/^(\s*)\d+\.\s*(.*)$/);
        const oldSub = line.match(/^(\s*)\d+\)\s*(.*)$/);

        if(mainMatch || oldMain){
            mainIdx++;
            subIdx = 0;
            const m = mainMatch || oldMain;
            return m[1] + mainIdx + ". " + m[2];
        }
        if(subMatch || oldSub){
            subIdx++;
            const m = subMatch || oldSub;
            return m[1] + subIdx + ") " + m[2];
        }
        return line;
    });
    r.value = newLines.join("\n");
}

function askChoiceModal(options) {
    return new Promise((resolve) => {
        const modal = document.getElementById("choiceModal");
        const container = document.getElementById("choiceBtnContainer");
        container.innerHTML = "";

        options.forEach(opt => {
            const btn = document.createElement("button");
            btn.textContent = opt;
            btn.onclick = () => {
                modal.style.display = "none";
                resolve(opt);
            };
            container.appendChild(btn);
        });

        modal.style.display = "block";
    });
}

async function useItem(i){
    let x = data[i];
    let t = x.text;

    t = t.replaceAll("[todaydate]", getTodayDate());

    const btnMatch = t.match(/\{btn:([^}]+)\}/);
    if(btnMatch) {
        const options = btnMatch[1].split("|");
        const selected = await askChoiceModal(options);
        t = t.replace(btnMatch[0], selected);
    }

const valveMatch = t.match(/\{판막선택\}/);
if (valveMatch) {
    const options = ["MR", "TR", "AR", "PR"];
    const selectedItems = [];
    const modal = document.getElementById("choiceModal");
    const container = document.getElementById("choiceBtnContainer");
    const title = document.getElementById("choiceModalTitle");

    container.innerHTML = "";
    title.textContent = "판막을 선택하세요";

    options.forEach(opt => {
        const btn = document.createElement("button");
        btn.textContent = opt;

        btn.onclick = () => {
            const idx = selectedItems.indexOf(opt);
            if (idx === -1) {
                selectedItems.push(opt);
                btn.style.background = "#176b3a";
            } else {
                selectedItems.splice(idx, 1);
                btn.style.background = "#1f4e78";
            }
        };
        container.appendChild(btn);
    });

    const done = document.createElement("button");
    done.textContent = "선택 완료";
    done.style.background = "#555";

    done.onclick = () => {
        modal.style.display = "none";
        t = t.replace("{판막선택}", selectedItems.join(", "));
        modal.dataset.valveDone = "1";
        modal.dispatchEvent(new Event("valvedone"));
    };

    container.appendChild(done);
    modal.dataset.valveDone = "0";
    modal.style.display = "block";

    await new Promise(resolve => {
        modal.addEventListener("valvedone", resolve, { once: true });
    });
}

    if(x.prompt){
        if(x.prompt.includes("sizes")){
            let rawInput = prompt("크기들을 쉼표(,)로 구분하여 입력하세요.\n예: 0.23, 0.29, 0.64");
            if(rawInput === null) return;

            let sizeArray = rawInput.split(',').map(s => s.trim()).filter(s => s.length > 0);

            if(sizeArray.length > 0){
                let numericSizes = sizeArray.map(s => parseFloat(s)).filter(n => !isNaN(n));
                let maxSize = numericSizes.length > 0 ? Math.max(...numericSizes) : '';
                let formattedList = sizeArray.map(s => s.endsWith('cm') ? s : s + 'cm').join(', ');

                t = t.replaceAll("{max}", maxSize).replaceAll("{sizes}", formattedList);
            } else {
                t = t.replaceAll("{max}", "").replaceAll("{sizes}", "");
            }
        } else {
            for(const p of x.prompt){
                let v = prompt(p + " 입력");
                if(v === null) return;
                t = t.replaceAll("{" + p + "}", v);
            }
        }
    }

    let r = document.getElementById("result");
    let startPos = r.selectionStart;
    let endPos = r.selectionEnd;

    if(startPos || startPos === 0){
        let prefix = r.value.substring(0, startPos);
        let suffix = r.value.substring(endPos, r.value.length);

        if(prefix.length > 0 && !prefix.endsWith("\n")){
            prefix += "\n";
        }
        if(suffix.length > 0 && !suffix.startsWith("\n")){
            suffix = "\n" + suffix;
        }

        r.value = prefix + t + suffix;
    } else {
        r.value += (r.value ? "\n" : "") + t;
    }

    reformatNumbers();
    r.focus();
    navigator.clipboard.writeText(t);
}

function addLine(){
    let s=prompt("직접 입력할 문구 (# 또는 @를 붙이면 자동 번호 생성)");
    if(s){
        let r=document.getElementById("result");
        r.value+=(r.value?"\n":"")+s;
        reformatNumbers();
    }
}

function filterAdminCat(c){
    data = readTable();
    adminCategoryFilter = c;
    renderTable();
}

function renderTable(){
    const filterBox = document.getElementById("adminCatFilter");
    const cats = ["전체", ...getOrderedCategories(data)];
    
    filterBox.innerHTML = cats.map(c => {
        let count = (c === "전체") ? data.length : data.filter(x => x.category === c).length;
        return `<button type="button" class="${c === adminCategoryFilter ? 'active' : ''}" onclick="filterAdminCat('${esc(c)}')">${esc(c)} (${count})</button>`;
    }).join("");

    const tbody = document.getElementById("phraseRows");
    let html = "";
    data.forEach((x, i) => {
        if(adminCategoryFilter !== "전체" && x.category !== adminCategoryFilter) return;
        
        html += `
        <tr data-i="${i}">
            <td><input data-k="category" value="${esc(x.category||"")}"></td>
            <td><input data-k="group" value="${esc(x.group||"")}"></td>
            <td><input data-k="label" value="${esc(x.label||"")}"></td>
            <td><textarea data-k="text">${esc(x.text||"")}</textarea></td>
            <td><input data-k="prompt" value="${esc((x.prompt||[]).join(", "))}" placeholder="크기, 위치 또는 sizes"></td>
            <td style="text-align:center">
                <button class="movebtn" type="button" onclick="moveItem(${i}, -1)">▲</button>
                <button class="movebtn" type="button" onclick="moveItem(${i}, 1)">▼</button>
            </td>
            <td><button class="delbtn" type="button" onclick="deleteItem(${i})">삭제</button></td>
        </tr>`;
    });
    tbody.innerHTML = html;
}

function readTable(){
    let newData = [...data];
    document.querySelectorAll("#phraseRows tr").forEach(tr => {
        const i = parseInt(tr.dataset.i);
        if (isNaN(i) || i < 0 || i >= newData.length) return;
        const o = {};
        tr.querySelectorAll("[data-k]").forEach(el => o[el.dataset.k] = el.value);
        o.prompt = o.prompt ? o.prompt.split(",").map(v => v.trim()).filter(Boolean) : [];
        if(!o.prompt.length) delete o.prompt;
        newData[i] = o;
    });
    return newData;
}

function moveItem(index, direction){
    data = readTable();

    if (adminCategoryFilter === "전체") {
        const targetIndex = index + direction;
        if(targetIndex < 0 || targetIndex >= data.length) return;
        
        const temp = data[index];
        data[index] = data[targetIndex];
        data[targetIndex] = temp;
    } else {
        const filteredIndices = [];
        data.forEach((x, idx) => {
            if (x.category === adminCategoryFilter) filteredIndices.push(idx);
        });

        const currentFilteredPos = filteredIndices.indexOf(index);
        if (currentFilteredPos === -1) return;

        const targetFilteredPos = currentFilteredPos + direction;
        if (targetFilteredPos < 0 || targetFilteredPos >= filteredIndices.length) return;

        const targetIndex = filteredIndices[targetFilteredPos];
        const temp = data[index];
        data[index] = data[targetIndex];
        data[targetIndex] = temp;
    }
    renderTable();
}

async function saveTable(){
    data = readTable();
    await saveTableToFirestore(); 
    render();
    document.getElementById("saveMsg").textContent="클라우드 저장 완료!";
    setTimeout(()=>document.getElementById("saveMsg").textContent="",1500)
}
  
function deleteItem(i){
    if(confirm("이 문구를 삭제할까요?")){
        data = readTable();
        data.splice(i,1);
        renderTable();
    }
}

function newItem(){
    data = readTable();
    let defaultCat = (adminCategoryFilter !== "전체") ? adminCategoryFilter : "복부";
    data.push({category: defaultCat, group: "", label: "", text: ""});
    renderTable();
    setTimeout(() => {
        const box = document.getElementById("phraseTableWrap");
        box.scrollTop = box.scrollHeight;
    }, 50);
}

function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll("'","&#39;").replaceAll('"',"&quot;")}

function saveLayout(){localStorage.setItem("usLayout",JSON.stringify({cat:document.getElementById("paneCat").style.width,result:document.getElementById("paneResult").style.width}))}
function loadLayout(){try{const x=JSON.parse(localStorage.getItem("usLayout")||"null");if(x){if(x.cat)document.getElementById("paneCat").style.width=x.cat;if(x.result)document.getElementById("paneResult").style.width=x.result}}catch(e){}}

function setupSplitter(id,leftId,rightId){
  const sp=document.getElementById(id);
  let dragging=false;
  sp.addEventListener("pointerdown",e=>{dragging=true;sp.setPointerCapture(e.pointerId);document.body.style.cursor="col-resize";document.body.style.userSelect="none"});
  sp.addEventListener("pointermove",e=>{
    if(!dragging)return;
    const wrap=document.getElementById("layoutWrap").getBoundingClientRect();
    if(id==="split1"){
      const leftW=Math.max(120,Math.min(e.clientX-wrap.left,wrap.width-400));
      document.getElementById(leftId).style.width=leftW+"px";
    }else{
      const rightW=Math.max(200,Math.min(wrap.right-e.clientX,wrap.width-400));
      document.getElementById(rightId).style.width=rightW+"px";
    }
    saveLayout();
  });
  sp.addEventListener("pointerup",()=>{dragging=false;document.body.style.cursor="";document.body.style.userSelect=""});
  sp.addEventListener("pointercancel",()=>{dragging=false;document.body.style.cursor="";document.body.style.userSelect=""});
}

function initApp(){
    loadLayout();
    setupSplitter("split1","paneCat","paneMid");
    setupSplitter("split2","paneMid","paneResult");
    render();
}

document.addEventListener("keydown", function(e){
    const activeEl = document.activeElement;
    const isEditing = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA");

    if (isEditing) return;

    if(e.ctrlKey && e.key.toLowerCase()==="z"){
        e.preventDefault();
        copyResult();
    }
    if(e.ctrlKey && e.key.toLowerCase()==="d"){
        e.preventDefault();
        clearResult();
    }
});

function backupDataFile() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "phrase_backup.json";
    a.click();
}

async function restoreDataFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const importedData = JSON.parse(e.target.result);
            if (Array.isArray(importedData)) {
                if (confirm("백업 파일의 문구로 데이터를 교체하고 파이어베이스에 저장하시겠습니까?")) {
                    data = importedData;
                    await saveTableToFirestore();
                    render();
                    if(typeof renderTable === "function") renderTable();
                    alert("성공적으로 복원되어 파이어베이스에 저장되었습니다!");
                }
            } else {
                alert("올바른 백업 파일 형식이 아닙니다.");
            }
        } catch (err) {
            console.error(err);
            alert("파일을 읽는 중 에러가 발생했습니다.");
        }
        event.target.value = "";
    };
    reader.readAsText(file);
}
</script>
<script>
(function(){
  const KEY="usAdminPanelGeometryV2";
  let drag={on:false,x:0,y:0,left:0,top:0};

  function init(){
    const admin=document.getElementById("admin");
    const bar=document.getElementById("adminDragBar");
    if(!admin || !bar || admin.dataset.geometryReady) return;
    admin.dataset.geometryReady="1";

    function save(){
      const r=admin.getBoundingClientRect();
      localStorage.setItem(KEY,JSON.stringify({
        left:r.left,top:r.top,width:r.width,height:r.height
      }));
    }

    function restore(){
      try{
        const g=JSON.parse(localStorage.getItem(KEY)||"null");
        if(!g) return;
        admin.style.transform="none";
        admin.style.left=Math.max(0,Math.min(g.left,innerWidth-g.width))+"px";
        admin.style.top=Math.max(0,Math.min(g.top,innerHeight-g.height))+"px";
        admin.style.width=Math.min(g.width,innerWidth*.96)+"px";
        admin.style.height=Math.min(g.height,innerHeight*.94)+"px";
      }catch(e){}
    }

    bar.addEventListener("mousedown",function(e){
      if(e.button!==0) return;
      drag.on=true;
      admin.style.transform="none";
      const r=admin.getBoundingClientRect();
      drag.x=e.clientX; drag.y=e.clientY;
      drag.left=r.left; drag.top=r.top;
      e.preventDefault();
    });

    document.addEventListener("mousemove",function(e){
      if(!drag.on) return;
      const r=admin.getBoundingClientRect();
      admin.style.left=Math.max(0,Math.min(innerWidth-r.width,drag.left+e.clientX-drag.x))+"px";
      admin.style.top=Math.max(0,Math.min(innerHeight-r.height,drag.top+e.clientY-drag.y))+"px";
    });

    document.addEventListener("mouseup",function(){
      if(drag.on){drag.on=false;save();}
    });

    window.addEventListener("resize",function(){
      const r=admin.getBoundingClientRect();
      if(r.right>innerWidth) admin.style.left=Math.max(0,innerWidth-r.width)+"px";
      if(r.bottom>innerHeight) admin.style.top=Math.max(0,innerHeight-r.height)+"px";
      save();
    });

    if(window.ResizeObserver){
      new ResizeObserver(function(){
        if(getComputedStyle(admin).display!=="none") save();
      }).observe(admin);
    }

    window.restoreAdminGeometry=restore;
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
  else init();

  const oldOpen=window.openAdmin;
  if(typeof oldOpen==="function"){
    window.openAdmin=function(){
      oldOpen.apply(this,arguments);
      setTimeout(function(){
        init();
        if(window.restoreAdminGeometry) window.restoreAdminGeometry();
      },30);
    };
  }
})();
</script>

    if(selectedEllipse) {
      const handle=rotationHandle(selectedEllipse);
      if(Math.hypot(p.x-handle.x,p.y-handle.y)<=22) {
        save();moving={id:e.pointerId,item:selectedEllipse,kind:'rotate',angle:selectedEllipse.angle,startAngle:Math.atan2(p.y-selectedEllipse.y,p.x-selectedEllipse.x)};canvas.setPointerCapture(e.pointerId);return;
      }
    }
    const ellipseHit=ellipses.slice().reverse().find(f=>insideEllipse(f,p));
    const hit=fibroids.slice().reverse().find(f=>Math.hypot(p.x-f.x,p.y-f.y)<=f.r);
    if(hit) {save();moving={id:e.pointerId,item:hit,dx:p.x-hit.x,dy:p.y-hit.y,x:hit.x,y:hit.y};canvas.setPointerCapture(e.pointerId);return;}
    if(ellipseHit && mode!=='text') {save();selectedEllipse=ellipseHit;moving={id:e.pointerId,item:ellipseHit,kind:'ellipse',dx:p.x-ellipseHit.x,dy:p.y-ellipseHit.y,x:ellipseHit.x,y:ellipseHit.y};canvas.setPointerCapture(e.pointerId);render();return;}
    selectedEllipse=null;render();
    if(mode==='text') {
      textPoint=p;updateTextSize();field.hidden=false;field.style.left=Math.min(p.x/canvas.width*100,70)+'%';field.style.top=Math.min(p.y/canvas.height*100,93)+'%';field.style.color=color;field.focus();return;
    }
    save();stroke={id:e.pointerId,start:p,last:p,base:pen.getImageData(0,0,canvas.width,canvas.height)};canvas.setPointerCapture(e.pointerId);style();
    if(mode==='pen') {pen.beginPath();pen.arc(p.x,p.y,2,0,Math.PI*2);pen.fill();render();}
  });
  canvas.addEventListener('pointermove',e=>{
    if(moving && moving.id===e.pointerId) {
      e.preventDefault();const p=point(e),f=moving.item;
      if(moving.kind==='rotate') {f.angle=moving.angle+Math.atan2(p.y-f.y,p.x-f.x)-moving.startAngle;render();return;}
      if(moving.kind==='ellipse') {
        const boundX=Math.sqrt((f.rx*Math.cos(f.angle))**2+(f.ry*Math.sin(f.angle))**2);
        const boundY=Math.sqrt((f.rx*Math.sin(f.angle))**2+(f.ry*Math.cos(f.angle))**2);
        f.x=Math.max(boundX,Math.min(canvas.width-boundX,p.x-moving.dx));f.y=Math.max(boundY,Math.min(canvas.height-boundY,p.y-moving.dy));render();return;
      }
      f.x=Math.max(f.r,Math.min(canvas.width-f.r,p.x-moving.dx));f.y=Math.max(f.r,Math.min(canvas.height-f.r,p.y-moving.dy));render();return;
    }
    if(!stroke || stroke.id!==e.pointerId) return;e.preventDefault();const p=point(e);
    if(mode==='pen') {style();pen.beginPath();pen.moveTo(stroke.last.x,stroke.last.y);pen.lineTo(p.x,p.y);pen.stroke();stroke.last=p;render();}
    else drawShape(p);
  });
  function end(e) {
    if(moving && moving.id===e.pointerId) {
      if(e.type==='pointercancel') {if(moving.kind==='rotate') moving.item.angle=moving.angle;else {moving.item.x=moving.x;moving.item.y=moving.y;}history.pop();}
      moving=null;if(canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);render();return;
    }
    if(!stroke || stroke.id!==e.pointerId) return;
    if(e.type==='pointercancel') {pen.putImageData(stroke.base,0,0);history.pop();}
    else if(mode==='circle') {
      const p=point(e);
      if(Math.abs(p.x-stroke.start.x)>2 && Math.abs(p.y-stroke.start.y)>2) {const f=ellipseAt(stroke.start,p);ellipses.push(f);selectedEllipse=f;status.textContent='원을 드래그해 이동하고, 위쪽 파란 손잡이를 드래그해 회전하세요.';}
      else history.pop();
    }
    else if(mode!=='pen') drawShape(point(e));
    stroke=null;if(canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);render();
  }
  canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
  field.addEventListener('keydown',e=>{if(e.isComposing) return;if(e.key==='Enter'){e.preventDefault();finishText();}else if(e.key==='Escape'){e.preventDefault();finishText(false);}});
  field.addEventListener('blur',()=>finishText());
  undo.addEventListener('click',()=>{finishText();const prev=history.pop();if(prev){bg.putImageData(prev.bg,0,0);pen.putImageData(prev.ink,0,0);textCtx.putImageData(prev.text,0,0);caption.textContent=prev.label;fibroids=prev.fibroids.map(f=>({...f}));ellipses=prev.ellipses.map(f=>({...f}));selectedEllipse=null;render();}});
  document.getElementById('drawingClear').addEventListener('click',()=>{finishText();save();fibroids=[];ellipses=[];selectedEllipse=null;pen.clearRect(0,0,canvas.width,canvas.height);textCtx.clearRect(0,0,canvas.width,canvas.height);render();});
  document.getElementById('drawingFlip').addEventListener('click',()=>{
    finishText();save();
    [background,ink,textLayer].forEach(layer=>{const temp=document.createElement('canvas');temp.width=canvas.width;temp.height=canvas.height;const t=temp.getContext('2d');t.translate(canvas.width,0);t.scale(-1,1);t.drawImage(layer,0,0);const c=layer.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);c.drawImage(temp,0,0);});
    fibroids.forEach(f=>f.x=canvas.width-f.x);
    ellipses.forEach(f=>{f.x=canvas.width-f.x;f.angle=-f.angle;});
    if(caption.textContent==='AVF (전경전굴)') caption.textContent='AVF (좌우반전)';else if(caption.textContent==='AVF (좌우반전)') caption.textContent='AVF (전경전굴)';render();
  });

  document.getElementById('drawingLoad').addEventListener('click',()=>{finishText();file.click();});
  file.addEventListener('change',()=>{
    const selected=file.files[0];file.value='';if(!selected) return;
    if(selected.type && !selected.type.startsWith('image/')) {status.textContent='이미지 파일을 선택해 주세요.';return;}
    const loadGeneration=generation;const reader=new FileReader();reader.onload=()=>{if(loadGeneration===generation) setImage(reader.result,selected.name,true);};reader.onerror=()=>{status.textContent='파일을 읽지 못했습니다.';};reader.readAsDataURL(selected);
  });
document.getElementById('drawingCopy').addEventListener('click',async()=>{
    finishText();render(false);
    try {
      // 1. 원본 크기 임시 캔버스에 현재 그림 복사 후 흰색 배경 제거
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(canvas, 0, 0);

      const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        // 흰색에 가까운 픽셀(R, G, B 모두 240 이상)을 투명하게 처리
        if (d[i] > 240 && d[i + 1] > 240 && d[i + 2] > 240) {
          d[i + 3] = 0;
        }
      }
      tempCtx.putImageData(imgData, 0, 0);

      // 2. 633 x 481 크기로 리사이징
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 633;
      exportCanvas.height = 481;
      const exportCtx = exportCanvas.getContext('2d');
      exportCtx.imageSmoothingEnabled = true;
      exportCtx.imageSmoothingQuality = 'high';
      exportCtx.drawImage(tempCanvas, 0, 0, exportCanvas.width, exportCanvas.height);

      if(!navigator.clipboard || typeof ClipboardItem==='undefined') throw new Error('clipboard unavailable');
      const blob=new Promise((resolve,reject)=>exportCanvas.toBlob(b=>b?resolve(b):reject(new Error('PNG conversion failed')),'image/png'));
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      status.textContent='투명 배경(633×481)으로 복사되었습니다. 원하는 곳에 붙여넣으세요.';showToast('투명 배경 이미지가 복사되었습니다!');
    } catch(error) {
      status.textContent='클립보드 복사를 사용할 수 없어 PNG 파일로 저장합니다.';
      const link=document.createElement('a');link.download='그림.png';link.href=canvas.toDataURL('image/png');link.click();
    } finally {render();}
  });
  document.getElementById('imagePopup').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z' && e.target!==field){e.preventDefault();undo.click();}});
  function resetEditor() {
    finishText(false);
    if(stroke) {if(canvas.hasPointerCapture(stroke.id)) canvas.releasePointerCapture(stroke.id);stroke=null;}
    if(moving && canvas.hasPointerCapture(moving.id)) canvas.releasePointerCapture(moving.id);
    moving=null;fibroids=[];ellipses=[];selectedEllipse=null;sizeInput.value='';
    history=[];ready=false;color='#000000';fontSize=36;fontSizeControl.value='36';file.value='';status.textContent='';
    document.querySelectorAll('[data-draw-color]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.drawColor===color)));
    pen.clearRect(0,0,canvas.width,canvas.height);textCtx.clearRect(0,0,canvas.width,canvas.height);bg.clearRect(0,0,canvas.width,canvas.height);
    selectMode('circle');render();setImage(defaultSrc,'AVF (전경전굴)',false);
  }
  document.getElementById('imagePopup').addEventListener('drawing-reset',resetEditor);
  resetEditor();
})();
</script>
</body></html>

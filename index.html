<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;background:#f5f7fa;color:#222;overflow:hidden}

.panel.result{display:flex;flex-direction:column}

#phraseTable th {

  border-bottom: 1px solid #ccd5df;

#phraseTable td {

.small{font-size:12px;color:#dcecff}

#choiceModal {

<!-- 🔒 파이어베이스 로그인 오버레이 HTML -->
<div id="loginOverlay">
  <div class="login-box">
    <h2>🔒 병원 시스템 로그인</h2>
    <p style="font-size:13px; color:#666;">파이어베이스 계정을 입력하세요</p>
    <input type="email" id="loginEmail" placeholder="이메일 입력">
    <input type="password" id="loginPassword" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') firebaseLogin()">
    <button onclick="firebaseLogin()">로그인</button>
    <div id="loginError">아이디나 비밀번호가 올바르지 않습니다.</div>
  </div>
</div>



<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAW6qlM__brCBG-9lKuVCwguUDnjbcTmX8",
      authDomain: "hospital-web-958bc.firebaseapp.com",
      projectId: "hospital-web-958bc",
      storageBucket: "hospital-web-958bc.firebasestorage.app",
      messagingSenderId: "453917371035",
      appId: "1:453917371035:web:3af6156729ca9cb324b43e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.firebaseLogin = function() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const errorMsg = document.getElementById('loginError');

        signInWithEmailAndPassword(auth, email, password)
            .then((userCredential) => {
                document.getElementById("loginOverlay").style.display = "none";
                initApp();
            })
            .catch((error) => {
                errorMsg.style.display = "block";
                document.getElementById('loginPassword').value = "";
                document.getElementById('loginPassword').focus();
            });
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById("loginOverlay").style.display = "none";
            initApp();
        }
    });

    window.onload = function() {
        const emailInput = document.getElementById('loginEmail');
        if(emailInput) emailInput.focus();
    };
</script>



<header><h1>결과 문구 작성기</h1><button class="topbtn" onclick="openAdmin()">⚙ 문구 관리</button><span class="small">버튼 클릭 → 결과에 추가 · 전체 복사</span></header>

// 1. 파이어베이스 Firestore에서 데이터 불러오기 함수
async function loadDataFromFirestore() {
    try {
        if (window.db && window.doc && window.getDoc) {
            const docRef = window.doc(window.db, "settings", "phraseData");
            const docSnap = await window.getDoc(docRef);
            if (docSnap.exists() && docSnap.data().items) {
                data = docSnap.data().items;
            } else {
                data = DEFAULT_DATA;
                await saveTableToFirestore();
            }
        }
    } catch (e) {
        console.error("데이터 로드 실패:", e);
    }
}

// 2. 파이어베이스 Firestore에 데이터 저장하기 함수
async function saveTableToFirestore() {
    try {
        const docRef = window.doc(window.db, "settings", "phraseData");
        await window.setDoc(docRef, { items: data });
    } catch (e) {
        console.error("데이터 저장 실패:", e);
    }
}

function getOrderedCategories(dataList){
    const presentCats = [...new Set(dataList.map(x => x.category))];
    const ordered = CATEGORY_ORDER.filter(c => presentCats.includes(c));
    const remain = presentCats.filter(c => !CATEGORY_ORDER.includes(c));
    return [...ordered, ...remain];
}

function render(){
    let q=document.getElementById("search").value.trim().toLowerCase();
    let cats=getOrderedCategories(data);
    
    if(!cats.includes(currentCategory) && cats.length > 0){
        currentCategory = cats[0];
    }

    document.getElementById("categories").innerHTML=cats.map(c=>`
        <div class="cat ${c===currentCategory && !q ? 'active' : ''}" onclick="selectCat('${esc(c)}')">${esc(c)}</div>
    `).join("");

    let items=data.filter(x=>(!q?x.category===currentCategory:true)&&(!q||(x.label+x.text+x.group+x.category).toLowerCase().includes(q)));
    document.getElementById("middleTitle").textContent=q?"검색 결과":currentCategory+" 문구";
    document.getElementById("items").innerHTML=items.map(x=>`<div class="item"><span class="tag">${esc(x.group)}</span><button onclick="useItem(${data.indexOf(x)})">${esc(x.label)}</button></div>`).join("")||'<div style="padding:20px;color:#777">검색 결과가 없습니다.</div>';
}

function selectCat(c){currentCategory=c;document.getElementById("search").value="";render()}

function getTodayDate(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
}

function reformatNumbers(){
    let r = document.getElementById("result");
    let lines = r.value.split("\n");
    let mainIdx = 0;
    let subIdx = 0;

    const newLines = lines.map(line => {
        // 들여쓰기 공백은 유지하고, 번호 표시용 # / @만 변환합니다.
        const mainMatch = line.match(/^(\s*)#\s*(.*)$/);
        const subMatch = line.match(/^(\s*)@\s*(.*)$/);
        const oldMain = line.match(/^(\s*)\d+\.\s*(.*)$/);
        const oldSub = line.match(/^(\s*)\d+\)\s*(.*)$/);

        if(mainMatch || oldMain){
            mainIdx++;
            subIdx = 0;
            const m = mainMatch || oldMain;
            return m[1] + mainIdx + ". " + m[2];
        }
        if(subMatch || oldSub){
            subIdx++;
            const m = subMatch || oldSub;
            return m[1] + subIdx + ") " + m[2];
        }
        return line;
    });
    r.value = newLines.join("\n");
}


/* 상단 중앙 모달창 형태의 버튼 선택 함수 */
function askChoiceModal(options) {
    return new Promise((resolve) => {
        const modal = document.getElementById("choiceModal");
        const container = document.getElementById("choiceBtnContainer");
        container.innerHTML = "";

        options.forEach(opt => {
            const btn = document.createElement("button");
            btn.textContent = opt;
            btn.onclick = () => {
                modal.style.display = "none";
                resolve(opt);
            };
            container.appendChild(btn);
        });

        modal.style.display = "block";
    });
}

async function useItem(i){
    let x = data[i];
    let t = x.text;

    t = t.replaceAll("[todaydate]", getTodayDate());

    // {btn:우측|좌측|양측} 형태 패턴 처리 (상단 중앙 버튼 선택창)
    const btnMatch = t.match(/\{btn:([^}]+)\}/);
    if(btnMatch) {
        const options = btnMatch[1].split("|");
        const selected = await askChoiceModal(options);
        t = t.replace(btnMatch[0], selected);
    }

// MR, TR, AR, PR 선택 기능 (중복 선택 방지)
const valveMatch = t.match(/\{판막선택\}/);

if (valveMatch) {
    const options = ["MR", "TR", "AR", "PR"];
    const selectedItems = [];
    const modal = document.getElementById("choiceModal");
    const container = document.getElementById("choiceBtnContainer");
    const title = document.getElementById("choiceModalTitle");

    container.innerHTML = "";
    title.textContent = "판막을 선택하세요";

    options.forEach(opt => {
        const btn = document.createElement("button");
        btn.textContent = opt;

        btn.onclick = () => {
            const idx = selectedItems.indexOf(opt);

            if (idx === -1) {
                selectedItems.push(opt);
                btn.style.background = "#176b3a";
            } else {
                selectedItems.splice(idx, 1);
                btn.style.background = "#1f4e78";
            }
        };

        container.appendChild(btn);
    });

    const done = document.createElement("button");
    done.textContent = "선택 완료";
    done.style.background = "#555";

    done.onclick = () => {
        modal.style.display = "none";
        t = t.replace(
            "{판막선택}",
            selectedItems.join(", ")
        );
        modal.dataset.valveDone = "1";
        modal.dispatchEvent(new Event("valvedone"));
    };

    container.appendChild(done);
    modal.dataset.valveDone = "0";
    modal.style.display = "block";

    await new Promise(resolve => {
        modal.addEventListener("valvedone", resolve, { once: true });
    });
}

    if(x.prompt){
        if(x.prompt.includes("sizes")){
            let rawInput = prompt("크기들을 쉼표(,)로 구분하여 입력하세요.\n예: 0.23, 0.29, 0.64");
            if(rawInput === null) return;

            let sizeArray = rawInput.split(',')
                                     .map(s => s.trim())
                                     .filter(s => s.length > 0);

            if(sizeArray.length > 0){
                let numericSizes = sizeArray.map(s => parseFloat(s)).filter(n => !isNaN(n));
                let maxSize = numericSizes.length > 0 ? Math.max(...numericSizes) : '';
                let formattedList = sizeArray.map(s => s.endsWith('cm') ? s : s + 'cm').join(', ');

                t = t.replaceAll("{max}", maxSize)
                     .replaceAll("{sizes}", formattedList);
            } else {
                t = t.replaceAll("{max}", "").replaceAll("{sizes}", "");
            }
        } else {
            for(const p of x.prompt){
                let v = prompt(p + " 입력");
                if(v === null) return;
                t = t.replaceAll("{" + p + "}", v);
            }
        }
    }

    let r = document.getElementById("result");
    let startPos = r.selectionStart;
    let endPos = r.selectionEnd;

    if(startPos || startPos === 0){
        let prefix = r.value.substring(0, startPos);
        let suffix = r.value.substring(endPos, r.value.length);

        if(prefix.length > 0 && !prefix.endsWith("\n")){
            prefix += "\n";
        }
        if(suffix.length > 0 && !suffix.startsWith("\n")){
            suffix = "\n" + suffix;
        }

        r.value = prefix + t + suffix;
    } else {
        r.value += (r.value ? "\n" : "") + t;
    }

    reformatNumbers();

    r.focus();
    navigator.clipboard.writeText(t);
}

function copyResult(){navigator.clipboard.writeText(document.getElementById("result").value)}
function clearResult(){document.getElementById("result").value=""}
function addLine(){
    let s=prompt("직접 입력할 문구 (# 또는 @를 붙이면 자동 번호 생성)");
    if(s){
        let r=document.getElementById("result");
        r.value+=(r.value?"\n":"")+s;
        reformatNumbers();
    }
}

function renderTable(){
    const filterBox = document.getElementById("adminCatFilter");
    const cats = ["전체", ...getOrderedCategories(data)];
    
    filterBox.innerHTML = cats.map(c => {
        let count = (c === "전체") ? data.length : data.filter(x => x.category === c).length;
        return `<button type="button" class="${c === adminCategoryFilter ? 'active' : ''}" onclick="filterAdminCat('${esc(c)}')">${esc(c)} (${count})</button>`;
    }).join("");

    const tbody = document.getElementById("phraseRows");
    
    let html = "";
    data.forEach((x, i) => {
        if(adminCategoryFilter !== "전체" && x.category !== adminCategoryFilter) return;
        
        html += `
        <tr data-i="${i}">
            <td><input data-k="category" value="${esc(x.category||"")}"></td>
            <td><input data-k="group" value="${esc(x.group||"")}"></td>
            <td><input data-k="label" value="${esc(x.label||"")}"></td>
            <td><textarea data-k="text">${esc(x.text||"")}</textarea></td>
            <td><input data-k="prompt" value="${esc((x.prompt||[]).join(", "))}" placeholder="크기, 위치 또는 sizes"></td>
            <td style="text-align:center">
                <button class="movebtn" type="button" onclick="moveItem(${i}, -1)">▲</button>
                <button class="movebtn" type="button" onclick="moveItem(${i}, 1)">▼</button>
            </td>
            <td><button class="delbtn" type="button" onclick="deleteItem(${i})">삭제</button></td>
        </tr>`;
    });
    
    tbody.innerHTML = html;
}

function readTable(){
    let newData = [...data];
    document.querySelectorAll("#phraseRows tr").forEach(tr => {
        const i = parseInt(tr.dataset.i);
        if (isNaN(i) || i < 0 || i >= newData.length) return;
        const o = {};
        tr.querySelectorAll("[data-k]").forEach(el => o[el.dataset.k] = el.value);
        o.prompt = o.prompt ? o.prompt.split(",").map(v => v.trim()).filter(Boolean) : [];
        if(!o.prompt.length) delete o.prompt;
        newData[i] = o;
    });
    return newData;
}

function moveItem(index, direction){
    data = readTable();

    if (adminCategoryFilter === "전체") {
        const targetIndex = index + direction;
        if(targetIndex < 0 || targetIndex >= data.length) return;
        
        const temp = data[index];
        data[index] = data[targetIndex];
        data[targetIndex] = temp;
    } else {
        const filteredIndices = [];
        data.forEach((x, idx) => {
            if (x.category === adminCategoryFilter) filteredIndices.push(idx);
        });

        const currentFilteredPos = filteredIndices.indexOf(index);
        if (currentFilteredPos === -1) return;

        const targetFilteredPos = currentFilteredPos + direction;
        if (targetFilteredPos < 0 || targetFilteredPos >= filteredIndices.length) return;

        const targetIndex = filteredIndices[targetFilteredPos];

        const temp = data[index];
        data[index] = data[targetIndex];
        data[targetIndex] = temp;
    }
    
    renderTable();
}

async function saveTable(){
    data = readTable();
    await saveTableToFirestore(); // 👈 파이어베이스 클라우드 서버에 저장!
    render();
    document.getElementById("saveMsg").textContent="클라우드 저장 완료!";
    setTimeout(()=>document.getElementById("saveMsg").textContent="",1500)
}
  
function deleteItem(i){
    if(confirm("이 문구를 삭제할까요?")){
        data = readTable();
        data.splice(i,1);
        renderTable();
    }
}

function newItem(){
    data = readTable();
    let defaultCat = (adminCategoryFilter !== "전체") ? adminCategoryFilter : "복부";

}

function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll("'","&#39;").replaceAll('"',"&quot;")}

function saveLayout(){localStorage.setItem("usLayout",JSON.stringify({cat:document.getElementById("paneCat").style.width,result:document.getElementById("paneResult").style.width}))}

function setupSplitter(id,leftId,rightId){
  const sp=document.getElementById(id);
  let dragging=false;
  sp.addEventListener("pointerdown",e=>{dragging=true;sp.setPointerCapture(e.pointerId);document.body.style.cursor="col-resize";document.body.style.userSelect="none"});
  sp.addEventListener("pointermove",e=>{
    if(!dragging)return;
    const wrap=document.getElementById("layoutWrap").getBoundingClientRect();
    if(id==="split1"){
      const leftW=Math.max(120,Math.min(e.clientX-wrap.left,wrap.width-400));
      document.getElementById(leftId).style.width=leftW+"px";
    }else{
      const rightW=Math.max(200,Math.min(wrap.right-e.clientX,wrap.width-400));
      document.getElementById(rightId).style.width=rightW+"px";
    }
    saveLayout();
  });
  sp.addEventListener("pointerup",()=>{dragging=false;document.body.style.cursor="";document.body.style.userSelect=""});
  sp.addEventListener("pointercancel",()=>{dragging=false;document.body.style.cursor="";document.body.style.userSelect=""});
}

document.addEventListener("keydown", function(e){
    const activeEl = document.activeElement;
    const isEditing = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA");

    if (isEditing) return;

    if(e.ctrlKey && e.key.toLowerCase()==="z"){
        e.preventDefault();
        copyResult();
    }
    if(e.ctrlKey && e.key.toLowerCase()==="d"){
        e.preventDefault();
        clearResult();
    }
});

<script>
(function(){
  const KEY="usAdminPanelGeometryV2";
  let drag={on:false,x:0,y:0,left:0,top:0};

  function init(){
    const admin=document.getElementById("admin");
    const bar=document.getElementById("adminDragBar");
    if(!admin || !bar || admin.dataset.geometryReady) return;
    admin.dataset.geometryReady="1";

    function save(){
      const r=admin.getBoundingClientRect();
      localStorage.setItem(KEY,JSON.stringify({
        left:r.left,top:r.top,width:r.width,height:r.height
      }));
    }

    function restore(){
      try{
        const g=JSON.parse(localStorage.getItem(KEY)||"null");
        if(!g) return;
        admin.style.transform="none";
        admin.style.left=Math.max(0,Math.min(g.left,innerWidth-g.width))+"px";
        admin.style.top=Math.max(0,Math.min(g.top,innerHeight-g.height))+"px";
        admin.style.width=Math.min(g.width,innerWidth*.96)+"px";
        admin.style.height=Math.min(g.height,innerHeight*.94)+"px";
      }catch(e){}
    }

    bar.addEventListener("mousedown",function(e){
      if(e.button!==0) return;
      drag.on=true;
      admin.style.transform="none";
      const r=admin.getBoundingClientRect();
      drag.x=e.clientX; drag.y=e.clientY;
      drag.left=r.left; drag.top=r.top;
      e.preventDefault();
    });

    document.addEventListener("mousemove",function(e){
      if(!drag.on) return;
      const r=admin.getBoundingClientRect();
      admin.style.left=Math.max(0,Math.min(innerWidth-r.width,drag.left+e.clientX-drag.x))+"px";
      admin.style.top=Math.max(0,Math.min(innerHeight-r.height,drag.top+e.clientY-drag.y))+"px";
    });

    document.addEventListener("mouseup",function(){
      if(drag.on){drag.on=false;save();}
    });

    window.addEventListener("resize",function(){
      const r=admin.getBoundingClientRect();
      if(r.right>innerWidth) admin.style.left=Math.max(0,innerWidth-r.width)+"px";
      if(r.bottom>innerHeight) admin.style.top=Math.max(0,innerHeight-r.height)+"px";
      save();
    });

    if(window.ResizeObserver){
      new ResizeObserver(function(){
        if(getComputedStyle(admin).display!=="none") save();
      }).observe(admin);
    }

    window.restoreAdminGeometry=restore;
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
  else init();

  const oldOpen=window.openAdmin;
  if(typeof oldOpen==="function"){
    window.openAdmin=function(){
      oldOpen.apply(this,arguments);
      setTimeout(function(){
        init();
        if(window.restoreAdminGeometry) window.restoreAdminGeometry();
      },30);
    };
  }
})();


  function backupDataFile() {
    const currentData = JSON.parse(localStorage.getItem("usData") || "null") || DEFAULT_DATA;
    const blob = new Blob([JSON.stringify(currentData, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "phrase_backup.json";
    a.click();
}
</script>
